name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      data_engine: ${{ steps.filter.outputs.data_engine }}
      sec_pipeline: ${{ steps.filter.outputs.sec_pipeline }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect affected apps
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yaml'
            data_engine:
              - 'apps/data-engine/**'
              - '.github/workflows/ci.yaml'
            sec_pipeline:
              - 'apps/sec-pipeline/**'
              - '.github/workflows/ci.yaml'
            ui:
              - 'apps/web/**'
              # The UI client and mocks are generated from the API contract.
              - 'apps/api/api/openapi.yaml'
              - '.github/workflows/ci.yaml'

  api:
    name: API
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod

      - name: Verify generated Go artifacts
        run: go run ./scripts/check-generated.go

      - name: Test API
        run: go test ./...

  data_engine:
    name: Data engine
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.data_engine == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check data engine formatting
        run: cargo fmt --check

      - name: Test data engine
        run: cargo test --locked

      - name: Run data engine Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  sec_pipeline:
    name: SEC pipeline
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.sec_pipeline == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sec-pipeline
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: apps/sec-pipeline/uv.lock

      - name: Synchronize the locked environment
        run: uv sync --locked

      - name: Check SEC pipeline architecture
        run: uv run --locked lint-imports

      - name: Test SEC pipeline
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build SEC pipeline package
        run: uv build

  ui:
    name: UI
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm check

      - name: Build production bundle
        run: pnpm build

  ci_result:
    name: CI result
    needs:
      - changes
      - api
      - data_engine
      - sec_pipeline
      - ui
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful component checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_RESULT: ${{ needs.api.result }}
          DATA_ENGINE_RESULT: ${{ needs.data_engine.result }}
          SEC_PIPELINE_RESULT: ${{ needs.sec_pipeline.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          printf 'changes=%s api=%s data_engine=%s sec_pipeline=%s ui=%s\n' \
            "$CHANGES_RESULT" "$API_RESULT" "$DATA_ENGINE_RESULT" \
            "$SEC_PIPELINE_RESULT" "$UI_RESULT"

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            exit 1
          fi

          for result in \
            "$API_RESULT" \
            "$DATA_ENGINE_RESULT" \
            "$SEC_PIPELINE_RESULT" \
            "$UI_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done
